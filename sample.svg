    <path d="M 600 240 l 30 -15 20 0 40 20 20 0 30 -15" stroke="#000" stroke-width="3" fill="none" />

    <!-- spacial path from users to Vercel -->
    <path d="M 90 375 l 20 0 100 50 20 0 180 -90 0 -10 -40 -20 0 -10" stroke="#000" stroke-width="3" fill="none" />

    <!-- Share - Start point -->
    <g transform="translate(60, 370)">
