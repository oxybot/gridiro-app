        <text font-family="Roboto" font-size="12" text-anchor="start" fill="white"
            transform="translate(40 0) scale(1 .5) rotate(-45) translate(-10 -10)">Team: superfaz's projects</text>
    </g>
    <g transform="translate(380 300)" filter="url(#drop-shadow)">
        <path d="M 0 0 l -110 -55, 0 -10, 100 -50, 20 0, 110 55 Z" stroke="#000" fill="#ffffff" />
        <path d="M 0 0 l 10 5, 20 0, 100 -50, 0 -10, -10 -5 Z" stroke="#000" fill="darkorchid" />
        <text font-family="Roboto" font-size="12" text-anchor="start" fill="white"
            transform="translate(40 0) scale(1 .5) rotate(-45) translate(-10 -10)">starfinder</text>
    </g>

    <!-- Grouping - Atlas -->
