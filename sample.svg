<svg width="900" height="450" xmlns="http://www.w3.org/2000/svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto');
    </style>

    <defs>
        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="4" dy="4" stdDeviation="3" flood-color="#00000066" />
        </filter>
    </defs>

    <!-- Grouping - Registrar -->
    <g transform="translate(180 400)">
        <path d="M 0 0 l -170 -85, 0 -10, 100 -50, 20 0, 170 85 Z" stroke="#000" fill="#ffffff" />
        <path d="M 0 0 l 30 15, 20 0, 100 -50, 0 -10, -30 -15 Z" stroke="#000" fill="darkcyan" />
        <text font-family="Roboto" font-size="12" text-anchor="start" fill="white"
            transform="translate(60 10) scale(1 .5) rotate(-45) translate(-10 -10)">EuroDNS</text>
        <path d="M 0 0 l 120 -60, 10 5, 0 10, -100 50, -20 0 Z" stroke="#000" fill="green" />
        <text font-family="Roboto" font-size="12" text-anchor="start" fill="white"
            transform="translate(40 0) scale(1 .5) rotate(-45) translate(-10 -10)">Account: monperso</text>
    </g>

    <!-- Grouping - Vercel -->
    <g transform="translate(380 360)">
        <path d="M 0 0 l -190 -95, 0 -10, 240 -120, 20 0, 190 95 Z" stroke="#000" fill="#ffffff" />
        <path d="M 0 0 l 30 15, 20 0, 240 -120, 0 -10, -30 -15 Z" stroke="#000" fill="darkcyan" />
        <text font-family="Roboto" font-size="12" text-anchor="start" fill="white"
            transform="translate(60 10) scale(1 .5) rotate(-45) translate(-10 -10)">Vercel</text>
