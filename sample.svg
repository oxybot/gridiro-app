    <path d="M 140 350 l 60 -30" stroke="#000" stroke-width="3" fill="none" />
    <path d="M 140 350 l 20 -10 0 -10 -40 -20 0 -10 20 -10" stroke="#000" stroke-width="3" fill="none" />
    <path d="M 140 350 l 20 -10 20 0 40 20 20 0 20 -10" stroke="#000" stroke-width="3" fill="none" />
